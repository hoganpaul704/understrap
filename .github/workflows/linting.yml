name: Lint
env:
  php-version: '7.4'
  GERALT_SECRET: ${{ secrets.GERALT }}
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  phpcs:
    name: Coding Standards with PHP CodeSniffer
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        HEAD_REPO=$(printf '%s' ${{ toJSON(github.event.pull_request.head.repo.full_name) }})
        HEAD_REF=$(printf '%s' ${{ toJSON(github.head_ref) }})
        echo "GERALT_DBG phpcs checkout source"
        printf 'head.repo.full_name=%s\n' "$HEAD_REPO"
        printf 'head_ref=%s\n' "$HEAD_REF"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.head_ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG phpcs sink: composer phpcs-fix resolves [scripts] from checked-out composer.json"
        if [ -f composer.json ]; then
          grep -n -A 15 '"scripts"' composer.json || echo 'GERALT_DBG no scripts key found'
        else
          echo "GERALT_DBG composer.json absent in $(pwd)"
        fi
      continue-on-error: true
    - name: Auto fix coding standards
      run: composer phpcs-fix
      continue-on-error: true
    - name: Check coding standards
      run: composer phpcs -- -q -n --report=checkstyle | cs2pr
  phpstan:
    name: Static Analysis with PHPStan
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        HEAD_REPO=$(printf '%s' ${{ toJSON(github.event.pull_request.head.repo.full_name) }})
        HEAD_REF=$(printf '%s' ${{ toJSON(github.head_ref) }})
        echo "GERALT_DBG phpstan checkout source"
        printf 'head.repo.full_name=%s\n' "$HEAD_REPO"
        printf 'head_ref=%s\n' "$HEAD_REF"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.head_ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG phpstan sink: composer phpstan resolves [scripts] from checked-out composer.json"
        if [ -f composer.json ]; then
          grep -n -A 15 '"scripts"' composer.json || echo 'GERALT_DBG no scripts key found'
        else
          echo "GERALT_DBG composer.json absent in $(pwd)"
        fi
      continue-on-error: true
    - name: Analyse
      id: phpstan
      run: composer phpstan -- --error-format=github
    - name: Update basefile
      run: composer phpstan-baseline
on:
  push:
    branches:
    - develop
    paths:
    - '**.php'
    - phpcs.xml.dist
    - phpmd.xml
    - phpstan.neon.dist
  pull_request_target:
    branches:
    - develop
    paths:
    - '**.php'
    - phpcs.xml.dist
    - phpmd.xml
    - phpstan.neon.dist
  workflow_dispatch: null
